url: https://danielmanter-usda.github.io/SHMI/

template:
  bootstrap: 5
  bootswatch: darkly

articles:
  - title: All articles
    contents:
      - SHMI-overview
      - articles/Background
      - articles/Cover
      - articles/Diversity
      - articles/Disturbance
      - articles/OrgInputs
      - articles/SHMI
    show_source: FALSE

navbar:
  title: "SHMI"
  type: default

  left:
    - text: "Get Started"
      href: "articles/SHMI-overview.html"

    - text: "Articles"
      menu:
        - text: "SHMI Background"
          href: "articles/Background.html"
        - text: "---"
        - text: "Cover Index"
          href: "articles/Cover.html"
        - text: "Diversity Index"
          href: "articles/Diversity.html"
        - text: "Disturbance Index"
          href: "articles/Disturbance.html"
        - text: "Organic Inputs (SHMI+)"
          href: "articles/OrgInputs.html"
        - text: "SHMI and SHMI+"
          href: "articles/SHMI.html"

    - text: "Reference"
      menu:
        - text: "All Functions"
          href: "reference/index.html"
        - text: "---"
        - text: "Core Workflow"
          href: "reference/index.html#core-workflow"
        - text: "Tillage (T-DISC)"
          href: "reference/index.html#tillage-t-disc"
        - text: "Climate"
          href: "reference/index.html#climate"
        - text: "Sub-index Functions"
          href: "reference/index.html#subindex-functions"
        - text: "Components"
          href: "reference/index.html#components"
        - text: "Helper Functions"
          href: "reference/index.html#helper-functions"
        - text: "Validation Functions"
          href: "reference/index.html#validation-functions"
        - text: "Plotting Functions"
          href: "reference/index.html#plotting-functions"

  right:
    - search: TRUE
    - icon: fa-github
      aria-label: "SHMI GitHub repository"
      href: https://github.com/DanielManter-USDA/SHMI

reference:
  - title: "Core Workflow"
    contents:
      - prepare_shmi_inputs
      - get_shmi_climate
      - build_shmi
      - shmi_weights
      - shmi_parameters

  - title: "Tillage (T-DISC)"
    desc: >
      USDA T-DISC implement values and operation names used to compute tillage
      intensity.
    contents:
      - tdisc_implements
      - tdisc_mapping

  - title: "Climate"
    desc: >
      Monthly climate normals and the growing-season months they define for
      Cover.
    contents:
      - growing_months

  - title: "Sub-index Functions"
    contents:
      - compute_cover
      - compute_diversity
      - compute_disturbance

  - title: "Components"
    desc: >
      All sub-indices at once, the monthly components of Cover, and the
      shares of years with organic amendments and grazing animals (which set
      the grazing credit and the SHMI+ amendment bonus), for calibration or
      inspection.
    contents:
      - shmi_components
      - compute_cover_monthly
      - compute_orginput_components

  - title: "Superseded"
    desc: >
      Kept so code written for SHMI 1.0 still runs.
    contents:
      - compute_orginput

  - title: "Helper Functions"
    contents:
      - clip_crop_to_rotation
      - download_shmi_example
      - download_shmi_template
      - get_shmi_example

  - title: "Validation Functions"
    contents:
      - validate_excel_input
      - validate_shmi_input

  - title: "Plotting Functions"
    contents:
      - plot_shmi_gauge
      - plot_shmi_lollipop

home:
  title: "SHMI"
  description: "Soil Health Management Index"
